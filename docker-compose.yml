services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: introducao_javascript_app
    restart: unless-stopped
    environment:
      APP_NAME: "Introdução ao JavaScript Lab"
      APP_ENV: docker
      APP_URL: http://localhost:8080
      PORT: 3000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-introducao_javascript}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - ./historia-conceitos:/app/historia-conceitos
      - ./tipos-e-variaveis:/app/tipos-e-variaveis
      - ./src:/app/src
      - ./public:/app/public
      - ./tests:/app/tests
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - introducao_javascript_network

  nginx:
    image: nginx:1.27-alpine
    container_name: introducao_javascript_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - introducao_javascript_network

  mysql:
    image: mysql:8.0
    container_name: introducao_javascript_mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-introducao_javascript}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - introducao_javascript_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: introducao_javascript_phpmyadmin
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - introducao_javascript_network

volumes:
  mysql_data:
    driver: local

networks:
  introducao_javascript_network:
    driver: bridge
